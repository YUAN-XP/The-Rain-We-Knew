<!doctype html><meta charset="utf-8"><title>P02 最终候选动画审计</title><style>body{background:#171b20;color:#eee;font:16px system-ui;margin:20px}button,select{font:inherit;padding:8px;margin-right:8px;background:#343b46;color:white;border:1px solid #687181;border-radius:6px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid:has(article:only-child){grid-template-columns:1fr}video{width:100%;background:#080a0d}article{background:#252c34;padding:12px;border-radius:8px}h3{margin:0 0 7px;font-size:16px}.note{color:#bbc5cf;line-height:1.6}input{font:inherit;width:65px}#status{margin:14px 0}</style><h1>P02 最终候选动画审计</h1><p class="note">20 个身份/朝向皮肤。正常速度与慢速使用同一份最终录像；不会另外生成占空间的视频。游戏内录像保留原背景；部分测试用隔离存档及诊断镜头准备状态。邱天交接最终前台片使用扩大的测试视野，不证明原房间镜头已修复。骨骼预览和剧情流程证据分开记录，最终美术由你判断。</p><select id="groups" aria-label="查看分组"></select><button id="normal">正常速度 1×</button><button id="slow">慢速 0.25×</button><button id="pause">暂停</button><button id="play">播放</button><label>定位秒数 <input id="seek" type="number" value="0" min="0"></label><button id="jump">定位</button><p id="status"></p><div class="grid" id="grid"></div><script>const groups=[{"name": "人物骨骼第 1 组（PV20）", "items": [{"title": "adult_default_right", "src": "production_runs/adult_default_right/20261003_194322/continuous_motion.mp4"}, {"title": "adult_default_left", "src": "production_runs/adult_default_left/20261003_194502/continuous_motion.mp4"}, {"title": "adult_overalls_right", "src": "production_runs/adult_overalls_right/20261003_194329/continuous_motion.mp4"}, {"title": "adult_overalls_left", "src": "production_runs/adult_overalls_left/20261003_194336/continuous_motion.mp4"}]}, {"name": "人物骨骼第 2 组（PV20）", "items": [{"title": "adult_school_right", "src": "production_runs/adult_school_right/20261003_194342/continuous_motion.mp4"}, {"title": "adult_school_left", "src": "production_runs/adult_school_left/20261003_194349/continuous_motion.mp4"}, {"title": "child_right", "src": "production_runs/child_right/20261003_194356/continuous_motion.mp4"}, {"title": "child_left", "src": "production_runs/child_left/20261003_194402/continuous_motion.mp4"}]}, {"name": "人物骨骼第 3 组（PV20）", "items": [{"title": "qt_adult_right", "src": "production_runs/qt_adult_right/20261003_194409/continuous_motion.mp4"}, {"title": "qt_adult_left", "src": "production_runs/qt_adult_left/20261003_194415/continuous_motion.mp4"}, {"title": "boy_child_right", "src": "production_runs/boy_child_right/20261003_194422/continuous_motion.mp4"}, {"title": "boy_child_left", "src": "production_runs/boy_child_left/20261003_194429/continuous_motion.mp4"}]}, {"name": "人物骨骼第 4 组（PV20）", "items": [{"title": "youth_right", "src": "production_runs/youth_right/20261003_194435/continuous_motion.mp4"}, {"title": "youth_left", "src": "production_runs/youth_left/20261003_194442/continuous_motion.mp4"}, {"title": "child_up", "src": "production_runs/child_up/20261003_194449/continuous_motion.mp4"}, {"title": "child_down", "src": "production_runs/child_down/20261003_194455/continuous_motion.mp4"}]}, {"name": "人物骨骼第 5 组（PV20）", "items": [{"title": "child_up_left", "src": "production_runs/child_up_left/20261003_194508/continuous_motion.mp4"}, {"title": "child_up_right", "src": "production_runs/child_up_right/20261003_194515/continuous_motion.mp4"}, {"title": "child_down_left", "src": "production_runs/child_down_left/20261003_194521/continuous_motion.mp4"}, {"title": "child_down_right", "src": "production_runs/child_down_right/20261003_194528/continuous_motion.mp4"}]}, {"name": "游戏内输入第 1 组 成人持物及交接", "items": [{"title": "邱天递证与跟随 前台测试 诊断镜头", "src": "native_gameplay_runs/20261004_012018_guide_handover_PV20r2_foreground_view_fixture/native_gameplay.mp4"}, {"title": "adult_default", "src": "native_gameplay_runs/20261004_002324_adult_default_PV20r2_final/native_gameplay.mp4"}, {"title": "adult_overalls", "src": "native_gameplay_runs/20261004_002410_adult_overalls_PV20r2_final/native_gameplay.mp4"}, {"title": "adult_school", "src": "native_gameplay_runs/20261004_002456_adult_school_PV20r2_final/native_gameplay.mp4"}]}, {"name": "游戏内输入第 2 组 儿童青年与同伴", "items": [{"title": "child_street", "src": "native_gameplay_runs/20261004_002546_child_street_PV20r2_final/native_gameplay.mp4"}, {"title": "youth", "src": "native_gameplay_runs/20261004_002618_youth_PV20r2_final/native_gameplay.mp4"}, {"title": "guide_follow_street", "src": "native_gameplay_runs/20261004_002647_guide_follow_street_PV20r2_final/native_gameplay.mp4"}, {"title": "guide_follow_home", "src": "native_gameplay_runs/20261004_002721_guide_follow_home_PV20r2_final/native_gameplay.mp4"}]}, {"name": "迷宫八向 输入及停止", "items": [{"title": "maze_short_eight", "src": "native_gameplay_runs/20261004_002755_maze_short_eight_PV20r2_final/native_gameplay.mp4"}]}, {"name": "河堤坐姿、起身与离亭（原流程时序）", "items": [{"title": "child + boy_child", "src": "native_gameplay_runs/20261003_210209_river_seated_stand_depart_follow_PV20/native_gameplay.mp4"}]}, {"name": "最终前台 递出姿势与持灯过四门", "items": [{"title": "右向递出姿势 不注入剧情奖励", "src": "native_gameplay_runs/20261004_012231_credential_right_PV20r2_foreground/native_gameplay.mp4"}, {"title": "左向递出姿势 不注入剧情奖励", "src": "native_gameplay_runs/20261004_012308_credential_left_PV20r2_foreground/native_gameplay.mp4"}, {"title": "持灯过四门 原门交互 诊断起点", "src": "native_gameplay_runs/20261004_012443_lamp_four_doors_PV20r2_foreground/native_gameplay.mp4"}]}, {"name": "20 朝向待机连续 4.48 个呼吸循环（PV20r2）", "items": [{"title": "原生待机 20 个身份及朝向 原游戏保持暂停", "src": "idle_cycles_PV20r2/idle_twenty_views.mp4"}]}];let rate=1;const sel=document.querySelector('#groups');groups.forEach((g,i)=>sel.add(new Option(g.name,i)));function mount(){document.querySelector('#grid').innerHTML=groups[sel.value].items.map(x=>`<article><h3>${x.title}</h3><video controls muted loop playsinline preload="metadata" src="${x.src}"></video></article>`).join('');document.querySelectorAll('video').forEach(v=>{v.playbackRate=rate;v.play()});status()};function status(){document.querySelector('#status').textContent=groups[sel.value].name+' | '+rate+'×'};sel.onchange=mount;document.querySelector('#normal').onclick=()=>{rate=1;document.querySelectorAll('video').forEach(v=>{v.playbackRate=1;v.currentTime=0;v.play()});status()};document.querySelector('#slow').onclick=()=>{rate=.25;document.querySelectorAll('video').forEach(v=>{v.playbackRate=.25;v.currentTime=0;v.play()});status()};document.querySelector('#pause').onclick=()=>document.querySelectorAll('video').forEach(v=>v.pause());document.querySelector('#play').onclick=()=>document.querySelectorAll('video').forEach(v=>v.play());document.querySelector('#jump').onclick=()=>document.querySelectorAll('video').forEach(v=>{v.currentTime=+document.querySelector('#seek').value;v.play()});mount();</script>
